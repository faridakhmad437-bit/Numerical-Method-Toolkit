[build-system]
requires=["setuptools>=77"]
build-backend="setuptools.build_meta"
[project]
name="numerical-methods-toolkit"
version="1.0.0"
description="Educational numerical methods toolkit for engineering and scientific computing"
readme="README.md"
license="MIT"
license-files=["LICENSE"]
authors=[{name="Akhmad Farid"}]
requires-python=">=3.11"
dependencies=["numpy>=2.0"]
keywords=["numerical methods","root finding","numerical integration","ODE","linear systems","interpolation","inverse kinematics","education"]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
[project.optional-dependencies]
dev=["pytest>=8.0","scipy>=1.14","matplotlib>=3.9","ruff>=0.6","build>=1.2"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-ra"
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
# Pyflakes and syntax errors: real defects, not formatting preferences.
select=["E9","F"]
[tool.ruff.lint.per-file-ignores]
"__init__.py"=["F401","F403"]
[tool.setuptools.packages.find]
where=["src"]
