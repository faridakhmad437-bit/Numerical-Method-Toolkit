[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="numerical-methods-toolkit"
version="1.0.0"
description="Educational numerical methods toolkit for engineering and scientific computing"
requires-python=">=3.11"
dependencies=["numpy>=2.0"]
[project.optional-dependencies]
dev=["pytest>=8.0","scipy>=1.14","matplotlib>=3.9","ruff>=0.6"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-ra"
[tool.ruff]
line-length=100
target-version="py311"
[tool.setuptools.packages.find]
where=["src"]
